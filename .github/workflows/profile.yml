name: Refresh the workbench
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/profile.yml'
permissions:
  contents: write
concurrency:
  group: profile-stats
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out profile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Test calculations and SVG rendering
        run: python -m unittest discover -s tests -v
      - name: Collect public statistics and render both themes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit generated profile
        run: |
          git config user.name harshit-vashisht
          git config user.email 241780191+harshit-vashisht@users.noreply.github.com
          git add README.md dark_mode.svg light_mode.svg data/stats.json cache/commits.json
          if git diff --cached --quiet; then
            echo 'Profile is already current.'
          else
            git commit -m 'Refresh public workbench statistics [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
